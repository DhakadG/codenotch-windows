name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and upload artifacts, but do not create a GitHub Release
        type: boolean
        default: true

# Read-only by default. The one step that publishes a release asks for write itself, so a
# compromised or misbehaving dependency during the build - and this workflow installs a
# toolchain, compiles C, and runs a signing script - cannot reach the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    # Raised from the workflow default only here, because this job ends by creating a
    # release. Every other job and workflow stays read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The build needs the code, not the token. Left persisted, the checkout
          # credential stays in .git/config for every later step, including
          # third-party actions and build scripts - a write-capable token sitting
          # where nothing needs it.
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      # The version is read from tauri.conf.json, which is the file the bundler itself
      # uses to name the installer. Typing it here by hand is how a tag and an installer
      # end up disagreeing about what version they are.
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $conf = Get-Content codenotch\tauri.conf.json -Raw | ConvertFrom-Json
          $cargo = Select-String -Path codenotch\Cargo.toml -Pattern '^version\s*=\s*"(.+)"' |
            Select-Object -First 1
          $cargoVersion = $cargo.Matches[0].Groups[1].Value
          if ($conf.version -ne $cargoVersion) {
            throw "Version mismatch: tauri.conf.json=$($conf.version) Cargo.toml=$cargoVersion"
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($tag -ne $conf.version) {
              throw "Tag v$tag does not match tauri.conf.json version $($conf.version)"
            }
          }
          "version=$($conf.version)" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $($conf.version)"

      # tauri.bundle.conf.json is an overlay, applied only here. It carries the hook
      # binary as a bundle resource and the command that builds it.
      #
      # It cannot live in tauri.conf.json: tauri-build reads that file from the *build
      # script*, and a declared resource that is not yet on disk aborts the build with
      # "resource path doesn't exist". That would break plain `cargo build`, `cargo test`
      # and `cargo clippy` for anyone who has not built the hook first — which is everyone
      # cloning the repository. As an overlay the resource is declared only for a bundle,
      # and `beforeBuildCommand` produces the file before the build script ever looks.
      - name: Build installer
        run: cargo tauri build --config tauri.bundle.conf.json
        working-directory: codenotch

      # The same assertion CI makes, repeated here because this is the binary that actually
      # reaches users. It is not redundant: CI once passed a build that imported
      # VCRUNTIME140 because a RUSTFLAGS environment variable had replaced the static-CRT
      # setting in .cargo/config.toml. Anything that can happen to a CI build can happen to
      # a release build, and only one of them gets downloaded.
      - name: Assert no VC++ redistributable dependency
        shell: pwsh
        run: |
          $dumpbin = Get-ChildItem -Path "${env:ProgramFiles}\Microsoft Visual Studio" `
            -Filter dumpbin.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object FullName -like '*Hostx64\x64*' | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe not found on the runner' }
          foreach ($exe in 'target\release\codenotch.exe', 'target\release\codenotch-hook.exe') {
            $bad = & $dumpbin.FullName /dependents $exe | Select-String -Pattern 'vcruntime140|msvcp140'
            if ($bad) { throw "Dynamic CRT import in ${exe}: $bad" }
          }
          Write-Host 'OK: no vcruntime140/msvcp140 imports'

      # The hook messenger is a second binary, and an installer without it silently loses
      # the whole working-state feature: the tray's hook install fails with "missing
      # codenotch-hook.exe". The first installer this project ever produced shipped without
      # it, so its presence is asserted rather than assumed.
      - name: Assert the hook messenger is in the installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem target\release\bundle\nsis\*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw 'no NSIS installer was produced' }
          $listing = & 7z l $setup.FullName
          foreach ($needed in 'codenotch.exe', 'codenotch-hook.exe') {
            if (-not ($listing | Select-String -SimpleMatch $needed)) {
              throw "$needed is missing from $($setup.Name)"
            }
          }
          Write-Host "OK: $($setup.Name) contains both binaries"

      # Signing is wired but inert until the certificate secrets exist, so turning it on
      # later is a secrets change rather than a workflow rewrite. scripts/sign.ps1 is a
      # documented no-op when CODESIGN_PROVIDER is unset.
      - name: Sign binaries
        shell: pwsh
        env:
          CODESIGN_PROVIDER: ${{ secrets.CODESIGN_PROVIDER }}
          CODESIGN_USERNAME: ${{ secrets.CODESIGN_USERNAME }}
          CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
          CODESIGN_CREDENTIAL_ID: ${{ secrets.CODESIGN_CREDENTIAL_ID }}
          CODESIGN_TOTP_SECRET: ${{ secrets.CODESIGN_TOTP_SECRET }}
        run: |
          ./scripts/sign.ps1 -Path target/release/codenotch.exe
          Get-ChildItem target/release/bundle/nsis/*.exe |
            ForEach-Object { ./scripts/sign.ps1 -Path $_.FullName }

      - name: Checksums
        shell: pwsh
        run: |
          $out = 'dist'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe $out
          Get-ChildItem $out -Filter *.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Out-File "$out/SHA256SUMS.txt" -Encoding ascii
          Get-Content "$out/SHA256SUMS.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codenotch-${{ steps.version.outputs.version }}
          path: dist/*

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true