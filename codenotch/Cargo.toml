[package]
name = "codenotch"
version = "0.3.0"
edition = "2021"
description = "Codenotch for Windows — usage notch for Claude, Codex, Cursor and Antigravity"
license = "MIT"
repository = "https://github.com/Im-Midi/codenotch-windows"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
dirs = "5"
notify = "6"
ureq = { version = "2", features = ["json", "native-tls"] } # native-tls：Antigravity 本机桥的自签证书只在 127.0.0.1 放行
native-tls = "0.2"
png = "0.17" # 应用图标 → PNG（提供商 logo 取自本机已安装应用的资源）
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# Cursor 凭证在 state.vscdb（SQLite）；bundled = 随包编译 SQLite C 源，首次编译多 1–2 分钟（避坑§39）
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Security_Credentials",
  "Win32_Graphics_Gdi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Globalization",
  "Win32_System_Console",
] }
