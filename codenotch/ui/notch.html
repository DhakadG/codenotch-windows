<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  /* Visual reference: upstream docs/specs/2026-08-28-usage-notch-design.md, reproduced for Windows */
  *{box-sizing:border-box} /* content-box padding once pushed the card past the window's left edge */
  html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden;user-select:none}
  body{font-family:"Segoe UI",system-ui,sans-serif;color:#fff}
  #root{position:relative;width:100%;height:100%}

  /* The pill on the right edge */
  #pill{
    position:absolute;right:0;top:50%;transform:translateY(-50%);
    width:70px;padding:18px 0;background:#000;
    border-radius:20px 0 0 20px;
    /* Stays visible on dark wallpapers: a thin stroke plus a faint glow, the only outline when black sits on black */
    border:1px solid #2e2e2e;border-right:none;
    box-shadow:none;
    display:flex;flex-direction:column;align-items:center;gap:14px;cursor:pointer;
  }
  /* Fillets: the concave arcs between the pill's top/bottom and the screen edge (the inverse rounded
     corner in the upstream design frame). An R×R black square hugs the edge and a radial gradient
     punches out the circle of radius R centred on its outer corner; what remains is the arc. A 1 px
     ring in the stroke colour joins the pill's own stroke (the outline cue on black wallpapers). */
  #pill::before,#pill::after{
    content:"";position:absolute;right:0;width:var(--fillet);height:var(--fillet);pointer-events:none;
  }
  #pill{--fillet:26px}
  #pill::before{
    top:calc(-1 * var(--fillet)); /* covers the 1 px stroke along the pill's top edge so there is no seam */
    background:radial-gradient(circle at 0 0, transparent calc(var(--fillet) - 1.5px), #2e2e2e calc(var(--fillet) - 0.5px), #000 calc(var(--fillet) + 0.5px));
  }
  #pill::after{
    bottom:calc(-1 * var(--fillet));
    background:radial-gradient(circle at 0 100%, transparent calc(var(--fillet) - 1.5px), #2e2e2e calc(var(--fillet) - 0.5px), #000 calc(var(--fillet) + 0.5px));
  }
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px}
  .ringwrap{position:relative;width:56px;height:56px}
  .ringwrap > svg.ring{position:absolute;inset:0;overflow:visible} /* pins only the ring itself; an inline logo svg must not match this or it ends up in the top-left corner */
  .glyph{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:700;color:#e8e8ea;letter-spacing:-.5px;
  }
  .glyph.small{font-size:15px}
  /* Glyphs: mark = the provider's own brand mark (monochrome, shown white); appicon = the installed app's icon (colour, rounded and shrunk) */
  .glyph img,.glyph svg{display:block;pointer-events:none;user-select:none}
  .glyph .mark{display:block;width:26px;height:26px;color:#e8e8ea}
  .glyph .mark svg{width:26px;height:26px;fill:currentColor} /* inline SVG follows currentColor, so it dims together with the cell */
  .glyph img.png{width:26px;height:26px;object-fit:contain}
  .glyph img.appicon{width:30px;height:30px;border-radius:8px;object-fit:cover}
  .c-head .mark{display:inline-block;width:16px;height:16px;color:#e8e8ea;margin-right:2px}
  .c-head .mark svg{width:16px;height:16px;fill:currentColor}
  .pct{font-size:15px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums}
  /* Time until the ring's window resets. Quiet on purpose: it qualifies the percentage above
     it rather than competing with it, and 70 pt of pill is not much room. */
  .cd{font-size:9px;color:#8a8a8a;font-variant-numeric:tabular-nums;letter-spacing:-.2px;margin-top:-3px}
  .dim{opacity:.55}
  /* Session arc animation */
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  /* Smooth, and still cheap.
     The original comment here was right about the cause and wrong about the only cure: a 60 fps
     SVG transform in a transparent always-on-top window did stutter the desktop compositor, so
     steps(12) cut it to ~10 fps - which is why it read as a slideshow rather than a spinner.
     The expense was never the frame rate, it was that each frame repainted. `will-change` promotes
     these two elements to their own compositor layers, after which a transform or an opacity change
     is handled entirely on the GPU: no repaint, no layout, nothing for the main thread to do per
     frame. That is the one pair of properties browsers can animate for free, which is exactly why
     rotation and fade were chosen in the first place.
     If this ever does cost anything on a weaker GPU, the honest fallback is a longer duration, not
     a coarser one - 2s linear still reads as motion, steps() reads as a fault. */
  /* No transform-box here on purpose. The spinner is a partial arc, so fill-box would put the
     origin at the centre of that fragment's own bounds and it would wobble around the ring
     instead of turning about it. The SVG default, view-box, is the ring's centre. */
  .arc-spin{animation:spin 1.2s linear infinite;transform-origin:center;will-change:transform}
  .arc-pulse{animation:pulse 1.1s ease-in-out infinite;will-change:opacity}
  /* Amber (waiting on you) to green (working) and back.
     The two states are drawn as different shapes - a full pulsing circle for attention, a
     turning arc fragment for running - so there is no single element whose colour can simply
     be transitioned. Cross-fading the two instead gives the change a duration without
     pretending one shape becomes the other, and 220 ms is long enough to read as a change of
     state rather than a flicker, short enough not to lag behind the thing it reports.
     `attr` is animated rather than opacity alone so a state that arrives mid-fade replaces
     the old one cleanly instead of compounding with it. */
  @keyframes arc-in{from{opacity:0}to{opacity:1}}
  @keyframes arc-out{from{opacity:1}to{opacity:0}}
  /* Two animations on one element: the state's own motion, and the cross-fade. Listing both
     keeps the spin or pulse running while the shape fades, so a state does not freeze on its
     way out. The outgoing element also stops responding to the pointer, since it is on its
     way to being removed. */
  .arc-exit{animation:arc-out 220ms ease-in both;pointer-events:none}
  .arc-exit.arc-spin{animation:arc-out 220ms ease-in both, spin 1.2s linear infinite}
  .arc-exit.arc-pulse{animation:arc-out 220ms ease-in both, pulse 1.1s ease-in-out infinite}
  .arc-enter.arc-spin{animation:arc-in 220ms ease-out both, spin 1.2s linear infinite}
  .arc-enter.arc-pulse{animation:arc-in 220ms ease-out both, pulse 1.1s ease-in-out infinite}
  /* Someone who has asked the system to stop animating things means it.
     One block, and `animation:none` rather than a short duration. Shortening the duration
     looks like the careful choice and is the opposite: these elements carry two animations,
     the cross-fade and the state's own infinite spin or pulse, and animation-duration applies
     to both - so setting it to 1ms left the spinner turning a thousand times a second at
     exactly the person who asked for less movement. The state is still legible without
     motion: green is present, amber is present and dimmed.
     The exiting overlay is hidden outright, since with no animation there is no animationend
     to remove it and it would otherwise sit on top of the incoming one until the fallback
     timer fired. */
  @media (prefers-reduced-motion:reduce){
    .arc-spin,.arc-enter.arc-spin{animation:none}
    .arc-pulse,.arc-enter.arc-pulse{animation:none;opacity:.6}
    .arc-enter{animation:none}
    /* The exit rules come last and match the incoming rules' specificity, because a bare
       `.arc-exit{opacity:0}` loses to `.arc-exit.arc-pulse{opacity:.6}` above - two classes
       beat one - and the outgoing amber would sit at 0.6 on top of the state replacing it
       until the fallback timer removed it. With no animation there is no animationend to
       trigger that removal promptly, so it has to be invisible from the moment it is marked. */
    .arc-exit,.arc-exit.arc-spin,.arc-exit.arc-pulse{animation:none;opacity:0}
  }

  /* Right-click menu. Replaces the WebView's own Back/Reload/Save-as menu, which offers
     nothing this app can do. Matches the hover card's surface so it reads as part of the
     application rather than as browser furniture. */
  #ctx{
    position:absolute;display:none;z-index:50;min-width:172px;padding:5px;
    background:#0a0a0a;border:1px solid #232326;border-radius:10px;
    box-shadow:0 8px 24px rgba(0,0,0,.55);font-size:12px;color:#e8e8ea;
  }
  #ctx.show{display:block}
  .ctx-item{padding:7px 10px;border-radius:6px;white-space:nowrap;cursor:default}
  .ctx-item:hover{background:#1c1c20}
  .ctx-sep{height:1px;margin:5px 6px;background:#232326}

  /* Hover card, shown to the left of the pill */
  #card{
    position:absolute;left:10px;right:80px;top:50%;transform:translateY(-50%);--tail:50%;
    /* Anchored on both sides = fluid width: whatever the WebView's real logical width, the card cannot
       extend past the window's left edge (a fixed max-width got clipped when the DPI disagreed).
       The 246 cap matches the upstream spec. */
    max-width:246px;margin-left:auto;background:#0a0a0a;border-radius:16px;padding:16px;
    overflow-wrap:anywhere;min-width:0;
    max-height:calc(100% - 16px);overflow:hidden; /* never taller than the window, however short it is */
    display:none;
  }
  #card.show{display:block}
  #card::after{ /* solid triangle pointing at the pill */
    content:"";position:absolute;right:-8px;top:var(--tail);transform:translateY(-50%);
    border:8px solid transparent;border-right:none;border-left:10px solid #0a0a0a;
  }
  .c-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .c-title{font-size:14px;font-weight:700}
  .c-sub{font-size:11px;color:#808080;margin-bottom:10px}
  .win{margin-top:10px}
  .w-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;flex-wrap:wrap;column-gap:8px}
  .w-label{color:#e8e8ea;font-weight:600;white-space:nowrap}
  .w-reset{color:#808080;font-size:11px;white-space:nowrap;margin-left:auto} /* wrap as a whole when it does not fit; never break inside a word */
  .w-track{height:4px;border-radius:2px;background:#2d2d2d;margin:6px 0 4px;overflow:hidden}
  .w-fill{height:100%;border-radius:2px}
  .w-used{font-size:11px;color:#808080}
  .c-note{font-size:12px;color:#c8c8c8;line-height:1.5;margin-top:6px}
  .c-sessions{margin-top:12px;border-top:1px solid #1e1e1e;padding-top:8px}
  .s-row{display:flex;align-items:center;gap:6px;font-size:11px;color:#b0b0b3;padding:2px 0}
  .s-dot{width:6px;height:6px;border-radius:3px;flex:0 0 auto}
  #notice{
    position:absolute;left:8px;bottom:6px;right:80px;font-size:10px;color:#808080;
    background:rgba(0,0,0,.85);border-radius:8px;padding:4px 8px;display:none
  }
  #notice.show{display:block}
</style>
</head>
<body>
<div id="root">
  <div id="card"></div>
  <div id="pill"></div><!-- one .cell per provider, stacked vertically (upstream: data-driven, the same layout for 1–5 cells) -->
  <div id="notice"></div>
<div id="ctx"></div>
</div>
<script>
const invoke = window.__TAURI__.core.invoke;
const listen = window.__TAURI__.event.listen;

/* Colour ramp (upstream palette values) */
const AMPLE='#00FF88', WATCH='#F2FF00', CRIT='#FF3F00';
const TRACK='#303030', AMBER='#FFBF00', RUNGREEN='#28E07B';
const tone=f=> f>=0.8?CRIT : f>=0.5?WATCH : AMPLE;

let usage={status:'',windows:[],fetched_at:0,note:''};
let codexSnap={status:'absent',windows:[],fetched_at:0,note:''};
let cursorSnap={status:'absent',windows:[],fetched_at:0,note:''};
let agSnap={status:'absent',windows:[],fetched_at:0,note:''};
let glyphs={}; // id → {kind:'mark'|'appicon', url}
let activity=[]; // working state of the non-Claude providers: {provider,state:'busy'|'waiting',name,detail,since}
// "Is it working?" per provider: Claude from the four-state engine, the others from the activity probe. Returns running | attention | idle
function workState(id){
  if(id==='claude'){
    if(stateSnap.agg==='running') return 'running';
    if(stateSnap.agg==='attention') return 'attention';
    // The engine cannot see cloud sessions: fall back to the desktop app's network activity
    if(activity.some(a=>a.provider==='claude'&&a.state==='busy')) return 'running';
    return 'idle';
  }
  const acts=activity.filter(a=>a.provider===id);
  if(acts.some(a=>a.state==='waiting')) return 'attention';
  if(acts.some(a=>a.state==='busy')) return 'running';
  return 'idle';
}
function glyphHtml(p,small){
  const g=glyphs[p.id];
  if(g&&g.kind==='svg'&&g.svg) return `<span class="mark">${g.svg}</span>`;
  if(g&&g.url) return `<img class="${g.kind}" src="${g.url}" alt="${p.name}"${small?' style="width:16px;height:16px;border-radius:4px"':''}>`;
  return small?'':p.glyph; // fallback letter
}
// Provider table (order = top to bottom in the pill). `glyph` is the fallback letter used when no mark is available
/* User preferences, pushed from the tray. Defaults match the previous behaviour exactly, so
   a config that has never been touched changes nothing. */
let prefs={hidden_providers:[],ring_window:'auto',show_percent:true,show_countdown:true,show_pace_tick:true,show_activity_arc:true};

function providers(){
  const list=[{id:'claude',name:'Claude',glyph:'C',snap:usage}];
  if(codexSnap.status!=='absent') list.push({id:'codex',name:'Codex',glyph:'Cx',snap:codexSnap});
  if(cursorSnap.status!=='absent') list.push({id:'cursor',name:'Cursor',glyph:'Cu',snap:cursorSnap});
  if(agSnap.status!=='absent') list.push({id:'gemini',name:'Antigravity',glyph:'Ag',snap:agSnap});
  return list.filter(p=>!prefs.hidden_providers.includes(p.id));
}

/* Does this window belong to the 5-hour family or the weekly one?
   Provider ids differ (`session`, `five_hour`, `primary`, `gemini-5h`), so the grouping is by
   meaning rather than by a single name. Anything unrecognised belongs to neither and is only
   ever chosen by "auto". */
function windowFamily(w){
  const id=(w.id||'').toLowerCase();
  if(id==='session'||id==='five_hour'||id==='primary'||id.endsWith('-5h')) return 'session';
  if(id.startsWith('seven_day')||id.startsWith('weekly')||id.endsWith('-weekly')||id==='secondary') return 'weekly';
  return '';
}

function headlineOf(snap){
  if(!snap.windows.length) return null;
  const metered=snap.windows.filter(w=>w.count==null);
  const pool=metered.length?metered:snap.windows;
  // A pinned choice only applies when this provider actually has that window; otherwise fall
  // back to auto rather than showing an empty ring for a window that does not exist here.
  if(prefs.ring_window!=='auto'){
    const pick=pool.filter(w=>windowFamily(w)===prefs.ring_window);
    if(pick.length) return pick.reduce((a,b)=> b.used>a.used?b:a);
  }
  if(metered.length) return metered.reduce((a,b)=> b.used>a.used?b:a);
  return snap.windows[0];
}
/* How old a reading may be before the cell is dimmed as stale.

   Comfortably above the interval at which a reading is actually refetched, on purpose. With
   the two equal, a ring dims the moment the first refresh is skipped or fails - which reads
   as `nothing is being read any more` when what happened is one missed attempt out of many
   that will keep being made. The upstream macOS app documents the same trap and keeps the
   same margin.

   This has to be revisited whenever MIN_REFETCH_SECS moves. Raising that floor to ten
   minutes against a five minute staleness threshold would have left every ring permanently
   dimmed while showing a perfectly current number. */
const STALE_AFTER_MS=20*60*1000;
function staleOf(snap){ if(snap.status==='stale') return true; return snap.fetched_at>0 && (Date.now()-snap.fetched_at)>STALE_AFTER_MS; }
let stateSnap={sessions:[],agg:'idle'};

function svgArc(r,frac,color,width,extra=''){
  const C=2*Math.PI*r;
  return `<circle cx="28" cy="28" r="${r}" fill="none" stroke="${color}" stroke-width="${width}"
    stroke-dasharray="${(C*frac).toFixed(2)} ${C.toFixed(2)}" stroke-linecap="butt"
    transform="rotate(-90 28 28)" ${extra}/>`;
}

function headline(){ // the cell shows the most constrained window — the one that will stop you first
  if(!usage.windows.length) return null;
  return usage.windows.reduce((a,b)=> b.used>a.used?b:a);
}

function isStale(){
  if(usage.status==='stale') return true;
  return usage.fetched_at>0 && (Date.now()-usage.fetched_at)>STALE_AFTER_MS;
}

/* How long the window behind a reading is, inferred from which window it is.
   The API sends when a window resets but never how long it runs, so the length has to come
   from the kind. Only the two lengths that are actually published are claimed; anything else
   returns 0 and simply gets no tick, because a pace mark drawn against a guessed window
   length is worse than no pace mark at all. */
function windowLenMs(w){
  const id=(w.id||'').toLowerCase();
  if(id==='session'||id==='five_hour'||id==='primary'||id.endsWith('-5h')||id==='extra_usage_5h') return 5*3600*1000;
  if(id.startsWith('seven_day')||id.startsWith('weekly')||id.endsWith('-weekly')||id==='secondary') return 7*24*3600*1000;
  return 0;
}

/* A mark on the ring showing how far through the reset window you are.
   Usage alone cannot tell you whether you are in trouble: 60% used is comfortable an hour
   before a reset and alarming five minutes in. The tick is the second half of that sentence,
   and the same idea as the pace tick in the taskbar mod. Drawn as a dark line under a light
   one so it stays visible over any ring colour, including where it crosses the filled arc. */
function paceTick(w){
  const len=windowLenMs(w);
  if(!len||!w.resets_at) return '';
  const remain=w.resets_at-Date.now();
  // Outside the window we assumed, the assumption is wrong, so draw nothing rather than
  // pinning the mark misleadingly at one end.
  if(remain<=0||remain>len) return '';
  const th=((1-remain/len)*360-90)*Math.PI/180;
  const c=Math.cos(th), s=Math.sin(th);
  const p=(r)=>[(28+r*c).toFixed(2),(28+r*s).toFixed(2)];
  const [x1,y1]=p(21.9), [x2,y2]=p(28);
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#0a0a0a" stroke-width="2.6" stroke-linecap="butt"/>`
       + `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#f2f2f4" stroke-width="1.1" stroke-linecap="butt"/>`;
}

function renderRing(){
  const ps=providers();
  // Rebuild the DOM only when the structure changes (never swap the element under the cursor)
  const want=ps.map(p=>p.id+':'+(glyphs[p.id]?glyphs[p.id].kind:'-')).join(',');
  if(pill.dataset.cells!==want){
    pill.innerHTML=ps.map(p=>`<div class="cell" data-p="${p.id}">
      <div class="ringwrap"><svg class="ring" viewBox="0 0 56 56"><g class="base"></g></svg><div class="glyph ${(!glyphs[p.id]&&p.glyph.length>1)?'small':''}">${glyphHtml(p)}</div></div>
      <div class="pct">—</div><div class="cd"></div></div>`).join('');
    pill.dataset.cells=want;
  }
  for(const p of ps){
    const cell=pill.querySelector(`.cell[data-p="${p.id}"]`); if(!cell) continue;
    const svg=cell.querySelector('svg.ring'), pct=cell.querySelector('.pct'), glyph=cell.querySelector('.glyph'), wrap=cell.querySelector('.ringwrap');
    const h=headlineOf(p.snap);
    let inner=`<circle cx="28" cy="28" r="22" fill="#2a2a2a"/><circle cx="28" cy="28" r="25" fill="none" stroke="${TRACK}" stroke-width="5"/>`;
    if(h && h.count==null){
      inner+=svgArc(25,Math.min(h.used,1),tone(h.used),5);
      // Only for a metered window, and only when it is not stale: a pace mark computed from
      // a reading of unknown age would point at a moment that has already passed.
      if(prefs.show_pace_tick && !staleOf(p.snap)) inner+=paceTick(h);
    }
    // Only the base layer is rewritten. The animated arc is a sibling that survives, because
    // replacing a node restarts its CSS animation - and this function runs on every usage,
    // state, glyph and preference event as well as every 30 seconds, so the spinner was being
    // yanked back to zero degrees several times a minute. That, not the frame rate alone, is
    // what made it look broken.
    svg.querySelector('g.base').innerHTML=inner;
    { // thin inner arc: spinning = working, amber pulse = waiting on you (one animation for all four, different sources)
      const ws=prefs.show_activity_arc?workState(p.id):'idle';
      if(cell.dataset.ws!==ws){
        cell.dataset.ws=ws;
        // Fade the outgoing shape out *while* the incoming one fades in, rather than
        // removing it first. Deleting it immediately meant amber vanished and green then
        // appeared into the gap, which is a cut with a delay in front of it, not a
        // transition. Both are absolutely positioned in the same SVG, so they overlap for
        // the length of the fade and the eye reads one becoming the other.
        const old=svg.querySelector('g.work:not(.arc-exit)');
        if(old){
          old.classList.add('arc-exit');
          old.classList.remove('arc-enter');
          // Remove on the animation's own end event rather than a matching timer, so the
          // two can never drift apart, and unconditionally after a moment in case the
          // element never animates - a hidden window fires no animation events.
          const drop=()=>old.remove();
          old.addEventListener('animationend',drop,{once:true});
          setTimeout(drop,400);
        }
        if(ws==='running'||ws==='attention'){
          const g=document.createElementNS('http://www.w3.org/2000/svg','g');
          // arc-enter cross-fades the incoming shape. Amber and green are different shapes -
          // a full pulsing circle against a turning fragment - so there is no one element
          // whose colour could be transitioned; fading the replacement in is the honest
          // equivalent and still gives the change a duration the eye can follow.
          g.setAttribute('class','work arc-enter '+(ws==='running'?'arc-spin':'arc-pulse'));
          g.innerHTML = ws==='running'
            ? svgArc(19,0.28,RUNGREEN,2.5)
            : `<circle cx="28" cy="28" r="19" fill="none" stroke="${AMBER}" stroke-width="2.5"/>`;
          svg.appendChild(g);
        }
      }
    }
    if(p.snap.status==='needsAuth'||p.snap.status==='none') pct.textContent='—';
    else if(h && h.count!=null) pct.textContent='~'+h.count;
    else if(h) pct.textContent=(h.derived?'~':'')+Math.round(h.used*100)+'%';
    else pct.textContent='…';
    pct.hidden=!prefs.show_percent;
    const cd=cell.querySelector('.cd');
    // Only for the window the ring is actually showing, and only while the reading is fresh:
    // a countdown is a claim about right now, and one computed from a stale reading keeps
    // ticking towards a moment that has already passed.
    const left=(prefs.show_countdown && h && !staleOf(p.snap)) ? untilReset(h.resets_at) : '';
    cd.textContent=left;
    cd.hidden=!left;
    glyph.classList.toggle('dim', !!(h && h.used>=1));
    wrap.classList.toggle('dim', staleOf(p.snap));
  }
}

function resetCopy(ms){
  if(!ms) return '';
  const diff=ms-Date.now();
  if(diff<=0) return 'Resetting…';
  if(diff<60*60*1000) return `Resets in ${Math.max(1,Math.round(diff/60000))} min`;
  const d=new Date(ms);
  const t=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  if(diff<24*60*60*1000) return `Resets at ${t}`;
  // A weekday only identifies a day inside the coming week, which upstream's ResetCopy learned
  // the hard way: Codex's monthly window resets 26 days out, and "Resets Mon 3:55 PM" reads as
  // *this* Monday - six days away rather than nearly four weeks. Past a week, day and month,
  // and no time of day, because nobody plans around 3:55 PM in four weeks.
  if(diff>=7*24*60*60*1000) return `Resets ${d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}`;
  return `Resets ${d.toLocaleDateString('en-US',{weekday:'short'})} ${t}`;
}

/* The same fact as resetCopy, in the width a pill has: "47m", "2h14m", "3d".
   Truncated rather than rounded, unlike the card's copy. A countdown that rounds up says
   there is more time left than there is, and this one sits directly under the percentage it
   qualifies - the two must not disagree about whether a window is nearly over. */
function untilReset(ms){
  if(!ms) return '';
  const left=ms-Date.now();
  if(left<=0) return '0m';
  const mins=Math.floor(left/60000);
  if(mins<1) return '<1m';
  if(mins<60) return `${mins}m`;
  const hours=Math.floor(mins/60);
  if(hours<24) return `${hours}h${String(mins%60).padStart(2,'0')}m`;
  return `${Math.floor(hours/24)}d`;
}

function ago(ms){
  const m=Math.round((Date.now()-ms)/60000);
  return m<60?`${m}m ago`:`${Math.round(m/60)}h ago`;
}

const STATE_DOT={running:RUNGREEN,attention:AMBER,done:'#57c7ff'};

let hoverId='claude';
function renderCard(){
  const c=document.getElementById('card');
  const p=providers().find(x=>x.id===hoverId)||providers()[0];
  const snap=p.snap;
  const headIcon=glyphHtml(p,true);
  let html=`<div class="c-head">${headIcon}<span class="c-title">${p.name} Usage</span></div>`;
  if(staleOf(snap)&&snap.fetched_at) html+=`<div class="c-sub">Updated ${ago(snap.fetched_at)}</div>`;
  if(snap.status==='needsAuth'){
    const who={claude:'Sign in to Claude Code to see usage.',cursor:'Sign in to Cursor to see usage.',codex:'Sign in to Codex to see usage.',gemini:'Sign in to Antigravity to see usage.'}[p.id]||'';
    html+=`<div class="c-note">${who}<br>${snap.note||''}</div>`;
  }else if(!snap.windows.length){
    html+=`<div class="c-note">${snap.note||'Waiting for first reading…'}</div>`;
  }else{
    for(const w of snap.windows){
      if(w.count!=null){
        html+=`<div class="win"><div class="w-row"><span class="w-label">${w.label}</span></div>
          <div class="w-used">${w.count>0?`~${w.count} request${w.count===1?'':'s'} today`:'no requests today'}</div></div>`;
        continue;
      }
      html+=`<div class="win">
        <div class="w-row"><span class="w-label">${w.label}</span><span class="w-reset">${resetCopy(w.resets_at)}</span></div>
        <div class="w-track"><div class="w-fill" style="width:${(Math.min(w.used,1)*100).toFixed(0)}%;background:${tone(w.used)}"></div></div>
        <div class="w-used">${w.derived?'~':''}${Math.round(w.used*100)}% Used</div>
      </div>`;
    }
    if(snap.note) html+=`<div class="c-note">${snap.note}</div>`;
  }
  if(p.id==='claude'){ // live sessions (a full list with jump-to-session is a follow-up)
    const act=stateSnap.sessions.filter(s=>s.state!=='idle');
    if(act.length){
      html+=`<div class="c-sessions">`;
      for(const s of act.slice(0,5)){
        html+=`<div class="s-row"><span class="s-dot" style="background:${STATE_DOT[s.state]||'#666'}"></span>${esc(s.title)}</div>`;
      }
      html+=`</div>`;
    }
  }else{ // other providers: detected activity rows (Cursor reports state; Codex/Antigravity are inferred from recent writes)
    const acts=activity.filter(a=>a.provider===p.id);
    if(acts.length){
      html+=`<div class="c-sessions">`;
      for(const a of acts.slice(0,5)){
        const col=a.state==='waiting'?AMBER:RUNGREEN;
        html+=`<div class="s-row"><span class="s-dot" style="background:${col}"></span>${esc(a.name)}<span style="color:#808080;margin-left:auto">${esc(a.detail)}</span></div>`;
      }
      html+=`</div>`;
    }
  }
  c.innerHTML=html;
  placeCard();
}
// The card follows the hovered cell: vertically centred on it (kept inside the window), tail pointing at it
function placeCard(){
  const cell=pill.querySelector(`.cell[data-p="${hoverId}"]`)||pill;
  const cr=cell.getBoundingClientRect();
  const cy=cr.top+cr.height/2;
  const H=innerHeight, ch=card.offsetHeight||0;
  let top=Math.round(cy-ch/2); top=Math.max(8,Math.min(top,H-ch-8));
  card.style.top=top+'px'; card.style.transform='none';
  card.style.setProperty('--tail',Math.max(16,Math.min(ch-16,Math.round(cy-top)))+'px');
}

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

/* Hover: stays expanded while either the pill or the card is under the cursor; collapses after a 250 ms grace period (upstream motion rule) */
const card=document.getElementById('card'), pill=document.getElementById('pill');
let hideTimer=null;
function showCard(){clearTimeout(hideTimer);card.classList.add('show');renderCard();armWatchdog();} // show first, then render: placeCard needs offsetHeight
function hideCard(){card.classList.remove('show');invoke('set_expanded',{on:false,rects:null}).catch(()=>{});}
function scheduleHide(){clearTimeout(hideTimer);hideTimer=setTimeout(hideCard,250);}
// ===== Diagnostics + geometry =====
function jslog(m){invoke('log_js',{msg:String(m)}).catch(()=>{});}
function callq(cmd,args){ // invoke with visible failure: any command error is reported on screen (a silent .catch used to swallow them)
  return invoke(cmd,args).catch(e=>{notice(cmd+' failed: '+(e&&e.message||e));throw e;});
}
// Hot rectangles are reported in physical pixels (multiplied by this page's real DPR), so the Rust side does no conversion — WebView2's DPR and the window scale can disagree
function rectOf(el){const r=el.getBoundingClientRect(),k=window.devicePixelRatio||1;return [r.left*k,r.top*k,r.width*k,r.height*k];}
function armWatchdog(){
  requestAnimationFrame(()=>{ // wait one frame so renderCard's new content is laid out before measuring
    if(!card.classList.contains('show'))return;
    callq('set_expanded',{on:true,rects:[rectOf(pill),rectOf(card)]}).catch(()=>{});
  });
}
// Viewport fit (pure front-end fallback, independent of Rust): the window is 340 × primary scale physical px,
// so if this page's CSS viewport is not 340 wide the WebView's DPR disagrees with the monitor; CSS zoom pulls the layout back to the design size.
function fitZoom(){
  const z=innerWidth/340;
  document.documentElement.style.zoom=(Math.abs(z-1)>0.02)?String(z):'';
  return z;
}
function reportDpr(){
  const z=fitZoom();
  jslog(`dpr=${window.devicePixelRatio} inner=${innerWidth}x${innerHeight} cssZoom=${z.toFixed(3)}`);
  callq('report_dpr',{dpr:window.devicePixelRatio||1,w:innerWidth,h:innerHeight}).catch(()=>{});
}
reportDpr();
window.addEventListener('resize',()=>{clearTimeout(window._dprT);window._dprT=setTimeout(()=>{reportDpr();if(card.classList.contains('show'))armWatchdog();},120);});
matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`).addEventListener('change',reportDpr);

/* Collapse test: no trust in element-level mouseenter/mouseleave/e.target at all —
   pure geometry: is the cursor (clientX/Y) inside pill rect ∪ card rect ∪ their bounding box?
   Leaving the window: document mouseout (relatedTarget=null) plus the Rust watchdog (system cursor) as a second line. */
function inRect(x,y,r,pad){return x>=r.left-pad&&y>=r.top-pad&&x<r.right+pad&&y<r.bottom+pad;}
function cellAt(x,y){
  for(const el of pill.querySelectorAll('.cell')){ if(inRect(x,y,el.getBoundingClientRect(),6)) return el.dataset.p; }
  return null;
}
function pointerInHot(x,y){
  const p=pill.getBoundingClientRect();
  if(inRect(x,y,p,4))return true;
  if(!card.classList.contains('show'))return false;
  const c=card.getBoundingClientRect();
  if(inRect(x,y,c,4))return true;
  const u={left:Math.min(p.left,c.left),top:Math.min(p.top,c.top),right:Math.max(p.right,c.right),bottom:Math.max(p.bottom,c.bottom)};
  return inRect(x,y,u,0);
}
let hideLogged=0;
document.addEventListener('mousemove',e=>{
  if(dragging)return; // no card while dragging
  const hot=pointerInHot(e.clientX,e.clientY);
  if(hot){
    clearTimeout(hideTimer);
    const id=cellAt(e.clientX,e.clientY);
    if(id&&id!==hoverId){ hoverId=id; if(card.classList.contains('show')){ renderCard(); armWatchdog(); } }
    if(!card.classList.contains('show')) showCard();
  }
  else if(card.classList.contains('show')){ if(hideLogged++<5) jslog(`mousemove left the hot area -> collapse at ${e.clientX},${e.clientY}`); scheduleHide(); }
});
document.addEventListener('mouseout',e=>{ // relatedTarget null = the cursor left the page
  if(!e.relatedTarget && card.classList.contains('show')){ if(hideLogged++<5) jslog('mouseout left the page -> collapse'); scheduleHide(); }
});
listen('pointer_left',()=>{clearTimeout(hideTimer);hideCard();}).catch(()=>{});
// Card content changes change its height -> report the hot rectangles again
listen('usage',()=>{if(card.classList.contains('show'))armWatchdog();}).catch(()=>{});
listen('state',()=>{if(card.classList.contains('show'))armWatchdog();}).catch(()=>{});
/* The pill can be dragged up and down the right edge. Press and move more than 4 px = drag (handed to Rust,
   which follows the system cursor; the card is collapsed first); release without moving = click (opens the provider's usage page). */
let press=null, dragging=false;
pill.addEventListener('mousedown',e=>{ if(e.button!==0)return; press={x:e.clientX,y:e.clientY,id:cellAt(e.clientX,e.clientY)||hoverId}; });
document.addEventListener('mousemove',e=>{
  if(!press||dragging)return;
  if(Math.abs(e.clientY-press.y)>4||Math.abs(e.clientX-press.x)>4){
    dragging=true; clearTimeout(hideTimer); hideCard();
    invoke('drag_begin').catch(err=>{notice('drag_begin failed: '+err);dragging=false;});
  }
});
/* Left click refreshes, double click opens the usage page.
   Opening a browser tab was the single-click action, which made the most casual gesture in
   the app the most disruptive one: a stray click on a pill pinned to the screen edge threw a
   window in front of whatever you were doing. Refresh is what someone glancing at a stale
   number actually wants, it is cheap, and it is undoable by ignoring it. The page is still
   one double click or one right-click menu item away.
   A pending single click waits out the double-click interval so the two do not both fire. */
/* Pending clicks are tracked per provider, not globally. With one shared timer, clicking
   Claude and then Cursor inside the double-click interval cancelled Claude's refresh and
   opened Cursor's usage page - two single clicks on two different cells being read as one
   double click on the second. Two clicks only pair when they land on the same provider. */
const pendingClick=new Map();
const DOUBLE_CLICK_MS=280;
document.addEventListener('mouseup',e=>{
  if(e.button!==0)return;
  const hit=press;
  press=null;
  if(!hit||dragging)return;
  const queued=pendingClick.get(hit.id);
  if(queued){ // second click on the same cell: cancel its refresh and open the page instead
    clearTimeout(queued);pendingClick.delete(hit.id);
    invoke('open_provider_page',{provider:hit.id}).catch(()=>{});
    return;
  }
  pendingClick.set(hit.id,setTimeout(()=>{
    pendingClick.delete(hit.id);
    invoke('refresh_provider',{provider:hit.id}).catch(()=>{});
  },DOUBLE_CLICK_MS));
});

/* The window is a WebView, so without this the right button opens Chromium's own menu -
   Back, Reload, Save as, Print - on an app that has no navigation, nothing to save and
   nothing to print. */
document.addEventListener('contextmenu',e=>{
  e.preventDefault();
  const cell=e.target.closest?.('.cell');
  openMenu(e.clientX,e.clientY,cell?cell.dataset.p:null);
});

function closeMenu(){const m=document.getElementById('ctx');if(m)m.classList.remove('show');}
function openMenu(x,y,provider){
  const m=document.getElementById('ctx');
  const p=provider?providers().find(q=>q.id===provider):null;
  const rows=[];
  if(p){
    rows.push({label:`Refresh ${p.name}`,run:()=>invoke('refresh_provider',{provider:p.id})});
    rows.push({label:`Open ${p.name} usage page`,run:()=>invoke('open_provider_page',{provider:p.id})});
    rows.push({label:`Hide ${p.name}`,run:()=>invoke('hide_provider',{provider:p.id})});
    rows.push({sep:true});
  }
  rows.push({label:'Refresh all',run:()=>invoke('refresh_provider',{provider:'all'})});
  m.innerHTML=rows.map((r,i)=>r.sep?'<div class="ctx-sep"></div>':`<div class="ctx-item" data-i="${i}">${r.label}</div>`).join('');
  m.classList.add('show');
  // Keep it inside the window; the pill lives at the right edge, so a menu placed naively
  // would open past it and be clipped.
  const w=m.offsetWidth,h=m.offsetHeight;
  m.style.left=Math.max(4,Math.min(x,window.innerWidth-w-4))+'px';
  m.style.top=Math.max(4,Math.min(y,window.innerHeight-h-4))+'px';
  m.onclick=ev=>{
    const it=ev.target.closest('.ctx-item');if(!it)return;
    const r=rows[+it.dataset.i];closeMenu();
    if(r&&r.run) r.run().catch?.(()=>{});
  };
}
document.addEventListener('mousedown',e=>{if(!e.target.closest?.('#ctx'))closeMenu();},true);
listen('pointer_left',()=>closeMenu()).catch(()=>{});
listen('drag_end',()=>{dragging=false;press=null;}).catch(()=>{});

function notice(msg){
  const n=document.getElementById('notice');
  n.textContent=msg;n.classList.add('show');
  clearTimeout(n._h);n._h=setTimeout(()=>n.classList.remove('show'),6000);
}

listen('usage',e=>{usage=e.payload||usage;renderRing();if(card.classList.contains('show'))renderCard();})
  .catch(e=>notice('listen(usage) failed: '+e));
listen('state',e=>{stateSnap=e.payload||stateSnap;renderRing();if(card.classList.contains('show'))renderCard();})
  .catch(e=>notice('listen(state) failed: '+e));
listen('notice',e=>notice(e.payload)).catch(()=>{});
listen('codex',e=>{codexSnap=e.payload||codexSnap;renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
listen('cursor',e=>{cursorSnap=e.payload||cursorSnap;renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
invoke('get_cursor').then(u=>{cursorSnap=u||cursorSnap;renderRing();}).catch(()=>{});
listen('antigravity',e=>{agSnap=e.payload||agSnap;renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
invoke('get_antigravity').then(u=>{agSnap=u||agSnap;renderRing();}).catch(()=>{});
listen('glyphs',e=>{glyphs=e.payload||glyphs;renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
// Preferences arrive like everything else. The cell signature is cleared so the pill is
// rebuilt rather than patched, otherwise hiding a provider would leave its cell on screen
// until some other change happened to alter the structure.
listen('prefs',e=>{prefs=e.payload||prefs;pill.dataset.cells='';renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
invoke('get_prefs').then(p=>{if(p){prefs=p;pill.dataset.cells='';renderRing();}}).catch(()=>{});
listen('activity',e=>{activity=e.payload||activity;renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
invoke('get_activity').then(a=>{activity=a||activity;renderRing();}).catch(()=>{});
invoke('get_glyphs').then(g=>{glyphs=g||glyphs;renderRing();}).catch(()=>{});
invoke('get_codex').then(u=>{codexSnap=u||codexSnap;renderRing();}).catch(()=>{});
invoke('get_usage').then(u=>{usage=u||usage;renderRing();}).catch(e=>notice('get_usage failed: '+e));
invoke('get_state').then(s=>{stateSnap=s||stateSnap;renderRing();}).catch(()=>{});
setInterval(renderRing,30_000); // stale state and reset copy move with time
</script>
</body>
</html>
